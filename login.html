<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Entrar | Seu Nome</title>
  <meta name="robots" content="noindex">
  <link rel="stylesheet" href="css/style.css">
</head>
<body>
  <header>
    <nav aria-label="Navegação principal">
      <a href="index.html">Voltar ao início</a>
    </nav>
  </header>

  <main>
    <section aria-labelledby="titulo-login">
      <h1 id="titulo-login">Entrar</h1>
      <form id="form-login" novalidate>
        <label for="email">E-mail</label>
        <input type="email" id="email" required autocomplete="email">

        <label for="senha">Senha</label>
        <input type="password" id="senha" required autocomplete="current-password">

        <button type="submit" id="btn-entrar">Entrar</button>
        <p id="mensagem" role="alert"></p>
      </form>
    </section>
  </main>

  <footer>
    <p>&copy; 2026 Seu Nome.</p>
  </footer>

  <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
  <script src="js/config.js"></script>
  <script src="js/login.js"></script>
</body>
</html>
